[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "video-agent"
version = "1.3.0"
description = "Local video evidence preparation for transcription and summarization"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = ["requests>=2.32", "imageio-ffmpeg>=0.6", "yt-dlp>=2026.10.21"]

[dependency-groups]
dev = ["mypy>=1.18", "pytest>=8", "ruff>=0.8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
video-agent = "video_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
video_agent = ["prompts/*.md"]

[tool.mypy]
files = ["src/video_agent"]
ignore_missing_imports = true

[tool.ruff]
line-length = 120
indent-width = 2

[tool.ruff.format]
quote-style = "single"
