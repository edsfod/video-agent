name: ffmpeg

# The LGPL FFmpeg the installer ships, as the `ffmpeg-lgpl` artifact for release.yml: bin/ffmpeg.exe and
# bin/ffprobe.exe, the licences, BUILD.txt and the source tarballs. The cache and the build are in
# .github/actions/ffmpeg, which test.yml's installer job uses directly so that it does not wait for another job.

on:
  workflow_call:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ffmpeg
      - uses: actions/upload-artifact@v7
        with:
          name: ffmpeg-lgpl
          path: build/ffmpeg
