name: test

on:
  push:
    branches: ['**'] # not tags: a release tag points at a commit that passed CI on its branch
  pull_request:

# A newer push to the same branch replaces a run still going, so a fixed intermediate commit does not report a
# failure. The FFmpeg build is cached as soon as it succeeds; a cold build cut short only happens when
# packaging/ffmpeg/build.sh changes twice within its 15 minutes.
#
# The installer job sets the time of a run (about 4 minutes when FFmpeg comes from the cache). npm packages, and the
# Electron and electron-builder downloads, are cached on gui/package-lock.json; the installer job takes FFmpeg from the
# cache itself and makes its test video with that LGPL build instead of installing another FFmpeg (Claude judgment,
# 2026-10-28, after the user asked for faster runs).
#
# Each job runs only when the push changed something it tests (.github/scripts/changed-jobs.sh): a change to the
# documentation runs none, the window's code runs gui and installer, the CLI's code runs all three. A skipped job counts
# as passed, so fast-forwarding main after a passed run still means every needed job passed (Claude judgment,
# 2026-10-28, after the user asked why every push ran everything).
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest # only reads git history and the runs; starts faster than Windows
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      cli: ${{ steps.pick.outputs.cli }}
      gui: ${{ steps.pick.outputs.gui }}
      installer: ${{ steps.pick.outputs.installer }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: pick
        run: bash .github/scripts/changed-jobs.sh
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref_name }}
          BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}

  cli:
    needs: changes
    if: needs.changes.outputs.cli == 'true'
    runs-on: windows-latest # Windows only (ARCHITECTURE.md)
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0 # publishes no major-version tag
      # The LGPL FFmpeg the installer ships, from the cache only (the installer job builds it on a miss); choco's
      # full build only when there is no cached copy yet.
      - id: ffmpeg
        uses: actions/cache/restore@v6
        with:
          path: build/ffmpeg
          key: ffmpeg-lgpl-${{ hashFiles('packaging/ffmpeg/build.sh') }}
      - if: steps.ffmpeg.outputs.cache-hit == 'true'
        run: Add-Content $env:GITHUB_PATH "$env:GITHUB_WORKSPACE\build\ffmpeg\bin"
      - if: steps.ffmpeg.outputs.cache-hit != 'true'
        run: choco install ffmpeg --no-progress -y
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run mypy
      - run: uv run pytest
      - run: uvx --from . video-agent --help

  gui:
    needs: changes
    if: needs.changes.outputs.gui == 'true'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: gui/package-lock.json
      - uses: actions/cache@v6
        with:
          path: ~\AppData\Local\electron\Cache
          key: electron-${{ hashFiles('gui/package-lock.json') }}
      # The LGPL FFmpeg the installer ships, from the cache only (the installer job builds it on a miss); choco's
      # full build only when there is no cached copy yet.
      - id: ffmpeg
        uses: actions/cache/restore@v6
        with:
          path: build/ffmpeg
          key: ffmpeg-lgpl-${{ hashFiles('packaging/ffmpeg/build.sh') }}
      - if: steps.ffmpeg.outputs.cache-hit == 'true'
        run: Add-Content $env:GITHUB_PATH "$env:GITHUB_WORKSPACE\build\ffmpeg\bin"
      - if: steps.ffmpeg.outputs.cache-hit != 'true'
        run: choco install ffmpeg --no-progress -y
      - run: uv tool install .
      - run: Add-Content $env:GITHUB_PATH "$env:USERPROFILE\.local\bin"
      - run: npm ci
        working-directory: gui
      - run: npm test
        working-directory: gui

  installer:
    needs: changes
    if: needs.changes.outputs.installer == 'true'
    runs-on: windows-latest
    timeout-minutes: 30 # about 5 minutes when FFmpeg comes from the cache; a cold FFmpeg build adds about 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ffmpeg
      # Kept for .git/hooks/pre-push, which takes the FFmpeg for its local packaging smoke test from the last run.
      - uses: actions/upload-artifact@v7
        with:
          name: ffmpeg-lgpl
          path: build/ffmpeg
      - uses: astral-sh/setup-uv@v10.3.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: gui/package-lock.json
      - uses: actions/cache@v6
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: electron-builder-${{ hashFiles('gui/package-lock.json') }}
      - run: Add-Content $env:GITHUB_PATH "$env:GITHUB_WORKSPACE\build\ffmpeg\bin" # only to make the test video
      - run: npm ci
        working-directory: gui
      - run: npm run dist
        working-directory: gui
      - run: Add-Content $env:GITHUB_PATH "$env:GITHUB_WORKSPACE\build\cli\video-agent"
      - run: npm run test:dist
        working-directory: gui
      - name: PATH choice in silent installs
        run: |
          $env:VA_E2E_SETUP = (Get-ChildItem gui\dist\Video-Agent-Setup-*.exe | Select-Object -First 1).FullName
          node --test gui/test/installer-path.test.js
      - name: Install the build silently
        run: |
          $setup = Get-ChildItem gui\dist\Video-Agent-Setup-*.exe | Select-Object -First 1
          $process = Start-Process $setup.FullName -ArgumentList '/S', "/D=$env:RUNNER_TEMP\va-inst" -PassThru -Wait
          if ($process.ExitCode) { exit $process.ExitCode }
      - run: node --test test/update-install.test.js
        working-directory: gui
        timeout-minutes: 8 # normally under a minute; a hang fails here instead of at GitHub's 6-hour limit
        env:
          VA_E2E_INSTALLED: ${{ runner.temp }}\va-inst\Video Agent.exe
      - uses: actions/upload-artifact@v7
        with:
          name: installer
          path: gui/dist/Video-Agent-Setup-*.exe
