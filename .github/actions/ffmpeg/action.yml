name: LGPL FFmpeg
description: >-
  Puts the LGPL FFmpeg the installer ships in build/ffmpeg: from the cache, from the verified prebuilt archive on
  GitHub Releases (packaging/ffmpeg/fetch.sh), or built by packaging/ffmpeg/build.sh in MSYS2 UCRT64 when build.sh's
  non-comment commands change (docs/distribution-design.md). Expects the repository checked out. The cache key's "2"
  marks trees that carry build/ffmpeg/BUILD-HASH, which fetch.sh needs to take a tree.

runs:
  using: composite
  steps:
    - id: key
      shell: bash
      run: echo "hash=$(bash packaging/ffmpeg/fetch.sh --hash)" >> "$GITHUB_OUTPUT"
    - id: cache
      uses: actions/cache/restore@v6
      with:
        path: build/ffmpeg
        key: ffmpeg-lgpl-2-${{ steps.key.outputs.hash }}
    - id: fetch
      shell: bash
      run: |
        if bash packaging/ffmpeg/fetch.sh; then
          echo "ready=true" >> "$GITHUB_OUTPUT"
        else
          echo "ready=false" >> "$GITHUB_OUTPUT"
        fi
    - if: steps.fetch.outputs.ready != 'true'
      uses: msys2/setup-msys2@v2
      with:
        msystem: UCRT64
        update: true
        install: >-
          make diffutils
          mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-nasm mingw-w64-ucrt-x86_64-pkgconf
          mingw-w64-ucrt-x86_64-meson mingw-w64-ucrt-x86_64-ninja mingw-w64-ucrt-x86_64-zlib
          mingw-w64-ucrt-x86_64-cmake mingw-w64-ucrt-x86_64-ccache
    # dav1d and SVT-AV1 from an earlier build with the same deps_key in build.sh, which then does not build them again.
    - id: deps-key
      if: steps.fetch.outputs.ready != 'true'
      shell: msys2 {0}
      run: echo "key=$(bash packaging/ffmpeg/build.sh --deps-key)" >> "$(cygpath -u "$GITHUB_OUTPUT")"
    - id: deps
      if: steps.fetch.outputs.ready != 'true'
      uses: actions/cache/restore@v6
      with:
        path: build/ffmpeg-deps
        key: ffmpeg-deps-${{ steps.deps-key.outputs.key }}
    # ccache's folder from the latest build that saved one: with the same compiler, only what changed is compiled again.
    - if: steps.fetch.outputs.ready != 'true'
      uses: actions/cache/restore@v6
      with:
        path: build/ccache
        key: ffmpeg-ccache-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: ffmpeg-ccache-
    - if: steps.fetch.outputs.ready != 'true'
      shell: msys2 {0}
      env:
        CCACHE_DIR: ${{ github.workspace }}/build/ccache
        # MSYS2 is installed afresh on every run, so the compiler is compared by content, not by file time.
        CCACHE_COMPILERCHECK: content
        CCACHE_MAXSIZE: 2G
      run: |
        ccache --zero-stats
        status=0
        bash packaging/ffmpeg/build.sh || status=$?
        ccache --show-stats
        exit $status
    - if: steps.fetch.outputs.ready != 'true'
      shell: bash
      run: bash packaging/ffmpeg/fetch.sh --mark
    # Saved as soon as build.sh has built them, even when FFmpeg then failed.
    - if: >-
        ${{ !cancelled() && steps.fetch.outputs.ready != 'true' && steps.deps.outputs.cache-hit != 'true' &&
        hashFiles('build/ffmpeg-deps/DEPS-KEY') != '' }}
      uses: actions/cache/save@v6
      with:
        path: build/ffmpeg-deps
        key: ffmpeg-deps-${{ steps.deps-key.outputs.key }}
    # Saved even when the build failed, so that the next attempt starts from what did compile. Of jobs building at the
    # same time, the first to finish saves it; the others only log that the key is taken.
    - if: ${{ !cancelled() && steps.fetch.outputs.ready != 'true' }}
      uses: actions/cache/save@v6
      with:
        path: build/ccache
        key: ffmpeg-ccache-${{ github.run_id }}-${{ github.run_attempt }}
    - if: steps.cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: build/ffmpeg
        key: ffmpeg-lgpl-2-${{ steps.key.outputs.hash }}
